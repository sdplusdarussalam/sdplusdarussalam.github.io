<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Tagihan Siswa - SD Plus Darussalam</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- html2canvas & jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- CSS ANIMASI PROGRESS BAR -->
    <style>
        @keyframes progress-stripe {
            0% { background-position: 1rem 0; }
            100% { background-position: 0 0; }
        }

        .animate-progress-stripe {
            background-image: linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.25) 25%,
                transparent 25%,
                transparent 50%,
                rgba(255, 255, 255, 0.25) 50%,
                rgba(255, 255, 255, 0.25) 75%,
                transparent 75%,
                transparent
            );
            background-size: 1rem 1rem;
            animation: progress-stripe 1s linear infinite;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const isMaintenance = false;

        const firebaseConfig = { 
            apiKey: "AIzaSyAaMqHz_QvEpN_d-ns7vblfMs1EWZ6PJEk",
            authDomain: "tagihan-siswa-1f2df.firebaseapp.com",
            projectId: "tagihan-siswa-1f2df",
            storageBucket: "tagihan-siswa-1f2df.firebasestorage.app",
            messagingSenderId: "79229043495",
            appId: "1:79229043495:web:815d8c2ca375f711c5df02"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function fmt(val) {
            if (val === undefined || val === null || val === "" || val === 0) return "-";
            if (typeof val === 'number') {
                if (val < 0) {
                    return "-" + new Intl.NumberFormat('id-ID').format(Math.abs(val));
                }
                return new Intl.NumberFormat('id-ID').format(val);
            }
            return val;
        }

        function sanitizeHTML(str) {
            if (typeof str !== 'string') return str;
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getProgressBarHTML(progresVal) {
            let percent = 0;
            if (typeof progresVal === 'string') {
                percent = parseFloat(progresVal.replace('%', '')) || 0;
            } else if (typeof progresVal === 'number') {
                percent = progresVal <= 1 ? progresVal * 100 : progresVal;
            }

            percent = Math.min(100, Math.max(0, percent));
            const roundedPercent = Math.round(percent);

            let bgClass = "bg-red-500";
            if (percent === 100) bgClass = "bg-emerald-500";
            else if (percent >= 75) bgClass = "bg-lime-500";
            else if (percent >= 40) bgClass = "bg-amber-400";
            else if (percent > 0) bgClass = "bg-orange-500";

            return `
                <div class="bg-slate-100 p-2.5 rounded-lg border border-slate-200 space-y-1.5">
                    <div class="flex justify-between items-center text-[11px] font-bold text-slate-800">
                        <span>Progres Pembayaran</span>
                        <span class="text-blue-900 font-extrabold text-xs">${roundedPercent}%</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden relative shadow-inner">
                        <div id="progress-bar-fill" 
                             class="h-full rounded-full transition-all duration-1000 ease-out ${bgClass} animate-progress-stripe" 
                             style="width: ${percent}%;" 
                             data-target-width="${percent}%">
                        </div>
                    </div>
                </div>
            `;
        }

        // FUNGSI PDF DENGAN RASIO A4 PRESISI (ANTI TERPOTONG)
        window.previewAndDownloadPDF = async function(nis, nama) {
            const element = document.getElementById('hasil-tagihan');
            if (!element) return;

            // Buka tab baru lebih awal
            const pdfWindow = window.open('', '_blank');
            if (pdfWindow) {
                pdfWindow.document.write('<div style="font-family:sans-serif; text-align:center; padding-top:50px; color:#333;"><h2>Membuat Dokumen PDF...</h2><p>Mohon tunggu sebentar.</p></div>');
            }

            const clone = element.cloneNode(true);

            // Hapus tombol aksi dari PDF
            const actionBtns = clone.querySelector('#action-buttons');
            if (actionBtns) actionBtns.remove();

            // Matikan animasi
            const progressBar = clone.querySelector('#progress-bar-fill');
            if (progressBar) progressBar.classList.remove('animate-progress-stripe');

            // KONTROL UKURAN A4 PRESISI (794px x 1123px pada 96 DPI)
            const wrapper = document.createElement('div');
            wrapper.style.position = 'fixed';
            wrapper.style.top = '0';
            wrapper.style.left = '0';
            wrapper.style.zIndex = '-9999';
            wrapper.style.width = '794px';
            wrapper.style.boxSizing = 'border-box';
            wrapper.style.backgroundColor = '#ffffff';
            wrapper.style.padding = '30px 40px';
            
            wrapper.appendChild(clone);
            document.body.appendChild(wrapper);

            try {
                const canvas = await html2canvas(clone, {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    scrollX: 0,
                    scrollY: 0,
                    windowWidth: 794
                });

                const imgData = canvas.toDataURL('image/jpeg', 0.98);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');

                const pdfWidth = pdf.internal.pageSize.getWidth();   // 210mm
                const pdfHeight = pdf.internal.pageSize.getHeight(); // 297mm

                // Hitung rasio gambar
                const imgWidth = pdfWidth - 20; // Margin kiri-kanan @ 10mm
                let imgHeight = (canvas.height * imgWidth) / canvas.width;

                // Jika melebihi tinggi A4, turunkan proporsional agar 100% muat dalam 1 halaman
                if (imgHeight > (pdfHeight - 20)) {
                    imgHeight = pdfHeight - 20;
                }

                pdf.addImage(imgData, 'JPEG', 10, 10, imgWidth, imgHeight);

                const pdfBlob = pdf.output('bloburl');

                if (pdfWindow) {
                    pdfWindow.location.href = pdfBlob;
                } else {
                    pdf.save(`Tagihan_${nis}_${nama.replace(/\s+/g, '_')}.pdf`);
                }

            } catch (err) {
                console.error("Gagal membuat PDF:", err);
                alert("Gagal memuat PDF, silakan coba lagi.");
                if (pdfWindow) pdfWindow.close();
            } finally {
                if (document.body.contains(wrapper)) {
                    document.body.removeChild(wrapper);
                }
            }
        };

        async function cariTagihan() {
            const nisnInput = document.getElementById('nisn-input');
            const ibuInput = document.getElementById('ibu-input');
            const btnCari = document.getElementById('btn-cari');
            const hasilDiv = document.getElementById('hasil-tagihan');

            if (!nisnInput || !ibuInput || !btnCari || !hasilDiv) return;

            const nisn = nisnInput.value.trim();
            const namaIbu = ibuInput.value.trim().toUpperCase();

            hasilDiv.classList.add('hidden');

            if (!nisn || !namaIbu) {
                alert("Mohon isi NIS dan Nama Ibu Kandung!");
                return;
            }

            const originalBtnText = btnCari.innerText;
            btnCari.disabled = true;
            btnCari.innerText = "Memproses...";

            try {
                const docSnap = await getDoc(doc(db, "siswa", nisn));

                if (docSnap.exists()) {
                    const d = docSnap.data();
                    const namaIbuDiDb = d.namaIbu ? d.namaIbu.trim().toUpperCase() : "";

                    if (namaIbuDiDb === namaIbu) {
                        const rLama = d.rekapLama || {};
                        const tBaru = d.tagihanBaru || {};
                        const rTerbaru = d.rekapTerbaru || {};
                        const rTerakhir = d.rekapTerakhir || {};

                        const namaSiswa = sanitizeHTML(d.nama || '-');
                        const nisSiswa = sanitizeHTML(d.nis || nisn);
                        const kelasSiswa = sanitizeHTML(d.kelas || '-');
                        const tahunPelajaran = sanitizeHTML(d.tahunPelajaran || '2026/2027 SMT 1');

                        const pesanWA = `Halo Admin SDPD, saya telah melakukan pembayaran untuk siswa ${namaSiswa} (NIS: ${nisSiswa}). Berikut bukti transfernya.`;
                        const waUrl = `https://wa.me/628998465724?text=${encodeURIComponent(pesanWA)}`;

                        const progressBarMarkup = getProgressBarHTML(d.progres);

                        hasilDiv.innerHTML = `
                            <!-- HEADER REKAP -->
                            <div class="text-center font-bold text-gray-800 uppercase tracking-wide border-b pb-2 mb-2">
                                <h3 class="text-[10px] text-slate-500">Rekap Tagihan Siswa</h3>
                                <h2 class="text-sm md:text-base text-blue-900 font-extrabold">SD PLUS DARUSSALAM</h2>
                                <p class="text-[10px] text-gray-500 font-normal">Tahun Pelajaran ${tahunPelajaran}</p>
                            </div>

                            <!-- IDENTITAS SISWA -->
                            <div class="bg-slate-50 p-2.5 rounded-lg border text-xs font-mono space-y-0.5 mb-3">
                                <div class="flex"><span class="w-16 font-semibold text-gray-600">NIS</span>: <span>${nisSiswa}</span></div>
                                <div class="flex"><span class="w-16 font-semibold text-gray-600">NAMA</span>: <span class="font-bold text-gray-800">${namaSiswa}</span></div>
                                <div class="flex"><span class="w-16 font-semibold text-gray-600">KLS</span>: <span>${kelasSiswa}</span></div>
                            </div>

                            <div class="space-y-3 text-xs">
                                <!-- 1. REKAPITULASI PEMBAYARAN LAMA -->
                                <div class="border rounded-lg p-2.5 bg-white shadow-sm">
                                    <h4 class="font-bold text-gray-700 border-b pb-1 mb-1.5 text-[11px]">a. Rekapitulasi Pembayaran (Semester Sebelumnya)</h4>
                                    <div class="space-y-0.5 font-mono text-[11px]">
                                        <div class="flex justify-between"><span>Tabungan Lama</span><span>${fmt(rLama.tabungan)}</span></div>
                                        <div class="flex justify-between"><span>Tab. Qurban Lama</span><span>${fmt(rLama.qurban)}</span></div>
                                        <div class="flex justify-between"><span>Syahriyah Lama</span><span>${fmt(rLama.syahriyah)}</span></div>
                                        <div class="flex justify-between pl-2 text-gray-600"><span>Catering</span><span>${fmt(rLama.catering)}</span></div>
                                        <div class="flex justify-between pl-2 text-gray-600"><span>Kegiatan</span><span>${fmt(rLama.kegiatan)}</span></div>
                                        <div class="flex justify-between pl-2 text-gray-600"><span>Seragam</span><span>${fmt(rLama.seragam)}</span></div>
                                        <div class="flex justify-between pl-2 text-gray-600"><span>Buku</span><span>${fmt(rLama.buku)}</span></div>
                                        <div class="flex justify-between pl-2 text-gray-600"><span>Lain-lain</span><span>${fmt(rLama.lain)}</span></div>
                                        <div class="flex justify-between font-bold text-gray-900 border-t pt-0.5 mt-0.5"><span>Total</span><span>${fmt(rLama.total)}</span></div>
                                    </div>
                                </div>

                                <!-- 2. TAGIHAN PEMBAYARAN BARU -->
                                <div class="border rounded-lg p-2.5 bg-white shadow-sm">
                                    <h4 class="font-bold text-gray-700 border-b pb-1 mb-1.5 text-[11px]">b. Tagihan Pembayaran Baru</h4>
                                    <div class="space-y-0.5 font-mono text-[11px]">
                                        <div class="flex justify-between"><span>Tabungan</span><span>${fmt(tBaru.tabungan)}</span></div>
                                        <div class="flex justify-between"><span>Tab. Qurban</span><span>${fmt(tBaru.qurban)}</span></div>
                                        <div class="flex justify-between"><span>Syahriyah</span><span>${fmt(tBaru.syahriyah)}</span></div>
                                        <div class="flex justify-between"><span>Catering</span><span>${fmt(tBaru.catering)}</span></div>
                                        <div class="flex justify-between"><span>Kegiatan</span><span>${fmt(tBaru.kegiatan)}</span></div>
                                        <div class="flex justify-between"><span>Seragam</span><span>${fmt(tBaru.seragam)}</span></div>
                                        <div class="flex justify-between"><span>Buku</span><span>${fmt(tBaru.buku)}</span></div>
                                        <div class="flex justify-between"><span>Lain-lain</span><span>${fmt(tBaru.lain)}</span></div>
                                        <div class="flex justify-between border-t pt-0.5 mt-0.5 text-gray-700 font-semibold"><span>Total</span><span>${fmt(tBaru.total)}</span></div>
                                        <div class="flex justify-between font-bold text-red-600 bg-red-50 p-1 rounded border border-red-100 mt-1"><span>Jumlah 1 & 2</span><span>${fmt(d.jumlahTotal || tBaru.jumlahTotal)}</span></div>
                                    </div>
                                </div>

                                <!-- 3. REKAP PEMBAYARAN TERBARU -->
                                <div class="border rounded-lg p-2.5 bg-white shadow-sm">
                                    <h4 class="font-bold text-gray-700 border-b pb-1 mb-1.5 text-[11px]">c. Rekap Pembayaran Terbaru</h4>
                                    <div class="space-y-0.5 font-mono text-[11px]">
                                        <div class="flex justify-between"><span>Tabungan</span><span>${fmt(rTerbaru.tabungan)}</span></div>
                                        <div class="flex justify-between"><span>Tab. Qurban</span><span>${fmt(rTerbaru.qurban)}</span></div>
                                        <div class="flex justify-between"><span>Syahriyah</span><span>${fmt(rTerbaru.syahriyah)}</span></div>
                                        <div class="flex justify-between"><span>Catering</span><span>${fmt(rTerbaru.catering)}</span></div>
                                        <div class="flex justify-between"><span>Kegiatan</span><span>${fmt(rTerbaru.kegiatan)}</span></div>
                                        <div class="flex justify-between"><span>Seragam</span><span>${fmt(rTerbaru.seragam)}</span></div>
                                        <div class="flex justify-between"><span>Buku</span><span>${fmt(rTerbaru.buku)}</span></div>
                                        <div class="flex justify-between"><span>Lain-lain</span><span>${fmt(rTerbaru.lain)}</span></div>
                                        <div class="flex justify-between"><span>Infaq</span><span>${fmt(rTerbaru.infaq)}</span></div>
                                        <div class="flex justify-between font-bold text-gray-900 border-t pt-0.5 mt-0.5"><span>Total</span><span>${fmt(rTerbaru.total)}</span></div>
                                    </div>
                                </div>

                                <!-- 4. REKAP PEMBAYARAN TERAKHIR (TUNGGAKAN) -->
                                <div class="border rounded-lg p-2.5 bg-blue-50/40 shadow-sm">
                                    <h4 class="font-bold text-gray-700 border-b pb-1 mb-1.5 text-[11px]">d. Rekap Pembayaran Terakhir</h4>
                                    <div class="space-y-0.5 font-mono text-[11px]">
                                        <div class="flex justify-between"><span>Tabungan</span><span>${fmt(rTerakhir.tabungan)}</span></div>
                                        <div class="flex justify-between"><span>Tab. Qurban</span><span>${fmt(rTerakhir.qurban)}</span></div>
                                        <div class="flex justify-between"><span>Syahriyah</span><span>${fmt(rTerakhir.syahriyah)}</span></div>
                                        <div class="flex justify-between"><span>Catering</span><span>${fmt(rTerakhir.catering)}</span></div>
                                        <div class="flex justify-between"><span>Kegiatan</span><span>${fmt(rTerakhir.kegiatan)}</span></div>
                                        <div class="flex justify-between"><span>Seragam</span><span>${fmt(rTerakhir.seragam)}</span></div>
                                        <div class="flex justify-between"><span>Buku</span><span>${fmt(rTerakhir.buku)}</span></div>
                                        <div class="flex justify-between"><span>Lain-lain</span><span>${fmt(rTerakhir.lain)}</span></div>
                                        <div class="flex justify-between font-bold text-red-600 border-t pt-0.5 mt-0.5"><span>Total</span><span>${fmt(rTerakhir.total)}</span></div>
                                    </div>
                                </div>

                                <!-- PROGRES PEMBAYARAN -->
                                ${progressBarMarkup}

                                <!-- METODE PEMBAYARAN & WHATSAPP -->
                                <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 space-y-1.5">
                                    <p class="text-[10px] text-gray-700">
                                        Bapak/Ibu, silakan melakukan pembayaran lewat transfer melalui rekening:
                                    </p>
                                    <div class="font-mono text-[11px] space-y-0.5 text-blue-950 font-semibold">
                                        <p>• Bank BRI : 6440 0103 6276 532 (a/n SD PLUS DARUSSALAM)</p>
                                        <p>• Bank JATIM : 180 2000 908 (a/n SD PLUS DARUSSALAM)</p>
                                    </div>
                                    <p class="text-[10px] text-gray-600">Atau langsung ke sekolah. Terima kasih.</p>
                                    
                                    <div id="action-buttons" class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2 pt-1">
                                        <button onclick="previewAndDownloadPDF('${nisSiswa}', '${namaSiswa}')" 
                                                class="w-full bg-red-600 hover:bg-red-700 text-white text-center py-2 rounded-lg font-bold text-xs transition-colors shadow flex items-center justify-center gap-1.5">
                                            <i class="fa-solid fa-file-pdf text-sm"></i> Lihat / Download PDF
                                        </button>
                                        <a href="${waUrl}" target="_blank" rel="noopener noreferrer"
                                           class="w-full bg-green-600 hover:bg-green-500 text-white text-center py-2 rounded-lg font-bold text-xs transition-colors shadow flex items-center justify-center gap-1.5">
                                            <i class="fa-brands fa-whatsapp text-sm"></i> Konfirmasi WA
                                        </a>
                                    </div>
                                </div>
                            </div>
                        `;

                        hasilDiv.classList.remove('hidden');

                    } else {
                        alert("Nama Ibu Kandung tidak cocok!");
                    }
                } else {
                    alert("NIS tidak ditemukan di database!");
                }
            } catch (e) { 
                console.error("Firestore Error:", e);
                alert("Terjadi kesalahan koneksi ke server."); 
            } finally {
                btnCari.disabled = false;
                btnCari.innerText = originalBtnText;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (isMaintenance) {
                document.body.className = "bg-slate-100 min-h-screen flex items-center justify-center p-4";
                document.body.innerHTML = `
                    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-200">
                        <div class="w-20 h-20 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner animate-pulse">
                            <i class="fa-solid fa-wrench text-3xl"></i>
                        </div>
                        <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider inline-block mb-3">
                            Sistem Maintenance
                        </span>
                        <h1 class="text-xl font-bold text-slate-800 mb-2">
                            Layanan Cek Tagihan Sedang Pemeliharaan
                        </h1>
                        <p class="text-xs text-slate-500 leading-relaxed mb-6">
                            Mohon maaf atas ketidaknyamanannya. Halaman pengecekan tagihan siswa saat ini sedang dalam proses pembaruan data dan pemeliharaan sistem.
                        </p>
                        <a href="https://wa.me/628998465724" target="_blank" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center space-x-2 transition-all shadow-md hover:shadow-lg">
                            <i class="fa-brands fa-whatsapp text-base"></i>
                            <span>Hubungi Admin / Tata Usaha</span>
                        </a>
                    </div>
                `;
                return;
            }

            const btnCari = document.getElementById('btn-cari');
            const formInputs = document.querySelectorAll('#nisn-input, #ibu-input');

            if (btnCari) {
                btnCari.addEventListener('click', cariTagihan);
            }

            formInputs.forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        cariTagihan();
                    }
                });
            });
        });
    </script>
</head>
<body class="relative min-h-screen flex flex-col items-center justify-center p-4 bg-cover bg-center bg-no-repeat" style="background-image: url('bangunan-sekolah.jpg');">
    
    <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px] z-0"></div>

    <div class="relative z-10 w-full max-w-xl bg-white/95 backdrop-blur-md rounded-xl shadow-2xl border border-white/20 overflow-hidden my-4">
        
        <div class="bg-blue-900 text-white p-5 text-center border-b-4 border-yellow-500">
            <h1 class="font-bold text-base md:text-lg tracking-wide uppercase">SD Plus Darussalam</h1>
            <p class="text-[10px] text-gray-200 tracking-wider uppercase mt-0.5">Sistem Verifikasi Pembayaran Syahriah</p>

        <div class="p-6 md:p-8 space-y-6">

            <div class="space-y-4">
                <div>
                    <label for="nisn-input" class="block text-[11px] font-bold text-gray-600 uppercase mb-1 tracking-wider">Nomor NIS Siswa</label>
                    <input type="text" id="nisn-input" placeholder="Contoh: 123" class="w-full px-3 py-2 border border-gray-300 bg-white rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 font-mono tracking-widest">
                </div>
                <div>
                    <label for="ibu-input" class="block text-[11px] font-bold text-gray-600 uppercase mb-1 tracking-wider">Nama Ibu Kandung</label>
                    <input type="text" id="ibu-input" placeholder="Masukkan nama lengkap ibu kandung" class="w-full px-3 py-2 border border-gray-300 bg-white rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 uppercase">

                <button id="btn-cari" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-lg text-xs transition-colors shadow-sm tracking-wide uppercase">
                    Mulai Pencarian Data

            </div>

            <!-- HASIL PENCARIAN -->
            <div id="hasil-tagihan" class="bg-white p-5 rounded-lg border border-gray-200 hidden shadow-md transition-all">
            </div>

            <div class="text-center pt-2 border-t border-gray-100">
                <a href="index.html" class="text-xs text-blue-900 hover:text-blue-700 font-bold inline-flex items-center gap-1 transition-colors">
                    ← Kembali ke Beranda Utama
                </a>
            </div>
        </div>
    </div>

</body>
</html>
