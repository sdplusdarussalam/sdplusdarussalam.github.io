<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Tagihan Siswa - SD Plus Darussalam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // =============================================================
        // SAKELAR MAINTENANCE (Ubah ke false jika ingin mengaktifkan web)
        // =============================================================
        const isMaintenance = true; 

        if (isMaintenance) {
            document.addEventListener('DOMContentLoaded', () => {
                document.body.className = "bg-slate-100 min-h-screen flex items-center justify-center p-4";
                document.body.innerHTML = `
                    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-200">
                        <div class="w-20 h-20 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner animate-pulse">
                            <i class="fa-solid fa-wrench text-3xl"></i>
                        </div>
                        <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider inline-block mb-3">
                            Sistem Maintenance
                        </span>
                        <h1 class="text-xl font-bold text-slate-800 mb-2">
                            Layanan Cek Tagihan Sedang Pemeliharaan
                        </h1>
                        <p class="text-xs text-slate-500 leading-relaxed mb-6">
                            Mohon maaf atas ketidaknyamanannya. Halaman pengecekan tagihan siswa saat ini sedang dalam proses pembaruan data dan pemeliharaan sistem.
                        </p>
                        <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 text-left mb-6 space-y-2">
                            <div class="flex items-start space-x-3 text-xs text-slate-600">
                                <i class="fa-solid fa-circle-info text-blue-600 mt-0.5"></i>
                                <span>Data tagihan sedang diperbarui oleh pihak tata usaha.</span>
                            </div>
                            <div class="flex items-start space-x-3 text-xs text-slate-600">
                                <i class="fa-solid fa-clock text-amber-600 mt-0.5"></i>
                                <span>Silakan coba kembali dalam beberapa saat lagi.</span>
                            </div>
                        </div>
                        <a href="https://wa.me/628998465724" target="_blank" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center space-x-2 transition-all shadow-md hover:shadow-lg">
                            <i class="fa-brands fa-whatsapp text-base"></i>
                            <span>Hubungi Admin / Tata Usaha</span>
                        </a>
                        <div class="mt-6 pt-4 border-t border-slate-100">
                            <p class="text-[10px] text-slate-400">
                                &copy; SD Plus Darussalam. All rights reserved.
                            </p>
                        </div>
                    </div>
                `;
            });
        }

        const firebaseConfig = { 
            apiKey: "AIzaSyAaMqHz_QvEpN_d-ns7vblfMs1EWZ6PJEk",
            authDomain: "tagihan-siswa-1f2df.firebaseapp.com",
            projectId: "tagihan-siswa-1f2df",
            storageBucket: "tagihan-siswa-1f2df.firebasestorage.app",
            messagingSenderId: "79229043495",
            appId: "1:79229043495:web:815d8c2ca375f711c5df02"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Helper untuk format mata uang/nilai tagihan
        function fmt(val) {
            if (val === undefined || val === null || val === "" || val === 0) return "-";
            if (typeof val === 'number') {
                return new Intl.NumberFormat('id-ID').format(val);
            }
            return val;
        }

        async function cariTagihan() {
            const nisnInput = document.getElementById('nisn-input');
            const ibuInput = document.getElementById('ibu-input');
            const btnCari = document.getElementById('btn-cari');
            const hasilDiv = document.getElementById('hasil-tagihan');

            const nisn = nisnInput.value.trim();
            const namaIbu = ibuInput.value.trim().toUpperCase();

            hasilDiv.classList.add('hidden');

            if (!nisn || !namaIbu) {
                alert("Mohon isi NIS dan Nama Ibu Kandung!");
                return;
            }

            const originalBtnText = btnCari.innerText;
            btnCari.disabled = true;
            btnCari.innerText = "Memproses...";

            try {
                const docSnap = await getDoc(doc(db, "siswa", nisn));

                if (docSnap.exists()) {
                    const d = docSnap.data();
                    const namaIbuDiDb = d.namaIbu ? d.namaIbu.trim().toUpperCase() : "";

                    if (namaIbuDiDb === namaIbu) {
                        const rLama = d.rekapLama || {};
                        const tBaru = d.tagihanBaru || {};
                        const rTerbaru = d.rekapTerbaru || {};
                        const rTerakhir = d.rekapTerakhir || {};

                        const namaSiswa = d.nama || '-';
                        const pesanWA = `Halo Admin SDPD, saya telah melakukan pembayaran untuk siswa ${namaSiswa} (NIS: ${nisn}). Berikut bukti transfernya.`;
                        const waUrl = `https://wa.me/628998465724?text=${encodeURIComponent(pesanWA)}`;

                        hasilDiv.innerHTML = `
                            <!-- HEADER REKAP -->
                            <div class="text-center font-bold text-gray-800 uppercase tracking-wide border-b pb-3 mb-3">
                                <h3 class="text-sm">Rekap Tagihan Siswa</h3>
                                <h2 class="text-base text-blue-900">SD PLUS DARUSSALAM</h2>
                                <p class="text-[11px] text-gray-500 font-normal">Tahun Pelajaran ${d.tahunPelajaran || '2026/2027 SMT 1'}</p>
                            </div>

                            <!-- IDENTITAS SISWA -->
                            <div class="bg-gray-50 p-3 rounded border text-xs font-mono space-y-1 mb-4">
                                <div class="flex"><span class="w-20 font-semibold text-gray-600">NIS</span>: <span>${d.nis || '-'}</span></div>
                                <div class="flex"><span class="w-20 font-semibold text-gray-600">NAMA</span>: <span class="font-bold text-gray-800">${namaSiswa}</span></div>
                                <div class="flex"><span class="w-20 font-semibold text-gray-600">KLS</span>: <span>${d.kelas || '-'}</span></div>
                            </div>

                            <div class="space-y-4 text-xs">
                                <!-- 1. REKAPITULASI PEMBAYARAN LAMA -->
                                <div class="border rounded p-3 bg-white">
                                    <h4 class="font-bold text-gray-700 border-b pb-1 mb-2">Rekapitulasi Pembayaran</h4>
                                    <div class="space-y-1 font-mono">
                                        <div class="flex justify-between"><span>a. Tabungan Lama</span><span>${fmt(rLama.tabungan)}</span></div>
                                        <div class="flex justify-between"><span>b. Tab. Qurban Lama</span><span>${fmt(rLama.qurban)}</span></div>
                                        <div class="flex justify-between"><span>c. Syahriyah Lama</span><span>${fmt(rLama.syahriyah)}</span></div>
                                        <div class="flex justify-between pl-3 text-gray-600"><span>Catering</span><span>${fmt(rLama.catering)}</span></div>
                                        <div class="flex justify-between pl-3 text-gray-600"><span>Kegiatan</span><span>${fmt(rLama.kegiatan)}</span></div>
                                        <div class="flex justify-between pl-3 text-gray-600"><span>Seragam</span><span>${fmt(rLama.seragam)}</span></div>
                                        <div class="flex justify-between pl-3 text-gray-600"><span>Buku</span><span>${fmt(rLama.buku)}</span></div>
                                        <div class="flex justify-between pl-3 text-gray-600"><span>Lain-lain</span><span>${fmt(rLama.lain)}</span></div>
                                        <div class="flex justify-between font-bold text-gray-900 border-t pt-1 mt-1"><span>Total</span><span>${fmt(rLama.total)}</span></div>
                                    </div>
                                </div>

                                <!-- 2. TAGIHAN PEMBAYARAN BARU -->
                                <div class="border rounded p-3 bg-white">
                                    <h4 class="font-bold text-gray-700 border-b pb-1 mb-2">d. Tagihan Pembayaran Baru</h4>
                                    <div class="space-y-1 font-mono">
                                        <div class="flex justify-between"><span>Tabungan</span><span>${fmt(tBaru.tabungan)}</span></div>
                                        <div class="flex justify-between"><span>Tab. Qurban</span><span>${fmt(tBaru.qurban)}</span></div>
                                        <div class="flex justify-between"><span>Syahriyah</span><span>${fmt(tBaru.syahriyah)}</span></div>
                                        <div class="flex justify-between"><span>Catering</span><span>${fmt(tBaru.catering)}</span></div>
                                        <div class="flex justify-between"><span>Kegiatan</span><span>${fmt(tBaru.kegiatan)}</span></div>
                                        <div class="flex justify-between"><span>Seragam</span><span>${fmt(tBaru.seragam)}</span></div>
                                        <div class="flex justify-between"><span>Buku</span><span>${fmt(tBaru.buku)}</span></div>
                                        <div class="flex justify-between"><span>Lain-lain</span><span>${fmt(tBaru.lain)}</span></div>
                                        <div class="flex justify-between border-t pt-1 mt-1 text-gray-700"><span>Total</span><span>${fmt(tBaru.total)}</span></div>
                                        <div class="flex justify-between font-bold text-red-600 border-t pt-1 mt-1"><span>Jumlah 1 & 2</span><span>${fmt(d.jumlahTotal || tBaru.jumlahTotal)}</span></div>
                                    </div>
                                </div>

                                <!-- 3. REKAP PEMBAYARAN TERBARU -->
                                <div class="border rounded p-3 bg-white">
                                    <h4 class="font-bold text-gray-700 border-b pb-1 mb-2">Rekap Pembayaran Terbaru</h4>
                                    <div class="space-y-1 font-mono">
                                        <div class="flex justify-between"><span>Tabungan</span><span>${fmt(rTerbaru.tabungan)}</span></div>
                                        <div class="flex justify-between"><span>Tab. Qurban</span><span>${fmt(rTerbaru.qurban)}</span></div>
                                        <div class="flex justify-between"><span>Syahriyah</span><span>${fmt(rTerbaru.syahriyah)}</span></div>
                                        <div class="flex justify-between"><span>Catering</span><span>${fmt(rTerbaru.catering)}</span></div>
                                        <div class="flex justify-between"><span>Kegiatan</span><span>${fmt(rTerbaru.kegiatan)}</span></div>
                                        <div class="flex justify-between"><span>Seragam</span><span>${fmt(rTerbaru.seragam)}</span></div>
                                        <div class="flex justify-between"><span>Buku</span><span>${fmt(rTerbaru.buku)}</span></div>
                                        <div class="flex justify-between"><span>Lain-lain</span><span>${fmt(rTerbaru.lain)}</span></div>
                                        <div class="flex justify-between"><span>Infaq</span><span>${fmt(rTerbaru.infaq)}</span></div>
                                        <div class="flex justify-between font-bold text-gray-900 border-t pt-1 mt-1"><span>Total</span><span>${fmt(rTerbaru.total)}</span></div>
                                    </div>
                                </div>

                                <!-- 4. REKAP PEMBAYARAN TERAKHIR -->
                                <div class="border rounded p-3 bg-blue-50/50">
                                    <h4 class="font-bold text-gray-700 border-b pb-1 mb-2">Rekap Pembayaran Terakhir</h4>
                                    <div class="space-y-1 font-mono">
                                        <div class="flex justify-between"><span>Tabungan</span><span>${fmt(rTerakhir.tabungan)}</span></div>
                                        <div class="flex justify-between"><span>Tab. Qurban</span><span>${fmt(rTerakhir.qurban)}</span></div>
                                        <div class="flex justify-between"><span>Syahriyah</span><span>${fmt(rTerakhir.syahriyah)}</span></div>
                                        <div class="flex justify-between"><span>Catering</span><span>${fmt(rTerakhir.catering)}</span></div>
                                        <div class="flex justify-between"><span>Kegiatan</span><span>${fmt(rTerakhir.kegiatan)}</span></div>
                                        <div class="flex justify-between"><span>Seragam</span><span>${fmt(rTerakhir.seragam)}</span></div>
                                        <div class="flex justify-between"><span>Buku</span><span>${fmt(rTerakhir.buku)}</span></div>
                                        <div class="flex justify-between"><span>Lain-lain</span><span>${fmt(rTerakhir.lain)}</span></div>
                                        <div class="flex justify-between font-bold text-red-600 border-t pt-1 mt-1"><span>Total</span><span>${fmt(rTerakhir.total)}</span></div>
                                    </div>
                                </div>

                                <!-- PROGRES PEMBAYARAN -->
                                <div class="bg-gray-100 p-3 rounded font-bold flex justify-between items-center text-sm">
                                    <span>Progres Pembayaran</span>
                                    <span class="text-blue-900">${d.progres || '0%'}</span>
                                </div>

                                <!-- METODE PEMBAYARAN & WHATSAPP -->
                                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 space-y-2">
                                    <p class="text-[11px] text-gray-700">
                                        Bapak/Ibu, silahkan melakukan pembayaran lewat transfer melalui rekening:
                                    </p>
                                    <div class="font-mono text-xs space-y-1 text-blue-950 font-semibold">
                                        <p>• Bank BRI : 6440 0103 6276 532 (a/n SD PLUS DARUSSALAM)</p>
                                        <p>• Bank JATIM : 180 2000 908 (a/n SD PLUS DARUSSALAM)</p>
                                    </div>
                                    <p class="text-[11px] text-gray-600">Atau langsung ke sekolah. Terima kasih.</p>
                                    
                                    <a href="${waUrl}" target="_blank" rel="noopener noreferrer"
                                       class="block w-full mt-3 bg-green-600 text-white text-center py-2.5 rounded-lg font-bold text-xs hover:bg-green-500 transition-colors shadow">
                                        Konfirmasi Pembayaran via WhatsApp
                                    </a>
                                </div>
                            </div>
                        `;
                        hasilDiv.classList.remove('hidden');
                    } else {
                        alert("Nama Ibu Kandung tidak cocok!");
                    }
                } else {
                    alert("NIS tidak ditemukan di database!");
                }
            } catch (e) { 
                console.error("Firestore Error:", e);
                alert("Terjadi kesalahan koneksi ke server."); 
            } finally {
                btnCari.disabled = false;
                btnCari.innerText = originalBtnText;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const btnCari = document.getElementById('btn-cari');
            if (btnCari) {
                btnCari.addEventListener('click', cariTagihan);
            }
        });
    </script>
</head>
<body class="relative min-h-screen flex flex-col items-center justify-center p-4 bg-cover bg-center bg-no-repeat" style="background-image: url('bangunan-sekolah.jpg');">
    
    <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px] z-0"></div>

    <div class="relative z-10 w-full max-w-xl bg-white/95 backdrop-blur-md rounded-xl shadow-2xl border border-white/20 overflow-hidden my-4">
        
        <div class="bg-blue-900 text-white p-5 text-center border-b-4 border-yellow-500">
            <h1 class="font-bold text-base md:text-lg tracking-wide uppercase">SD Plus Darussalam</h1>
            <p class="text-[10px] text-gray-200 tracking-wider uppercase mt-0.5">Sistem Verifikasi Pembayaran Syahriah</p>
        </div>

        <div class="p-6 md:p-8 space-y-6">
            <div>
                <h2 class="text-lg font-bold text-gray-800 text-center">Cek Tagihan Siswa</h2>
                <p class="text-xs text-gray-500 text-center mt-1">
                    Silakan masukkan kombinasi 3 digit NIS aktif siswa beserta Nama Ibu Kandung sesuai data Dapodik sekolah.
                </p>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="nisn-input" class="block text-[11px] font-bold text-gray-600 uppercase mb-1 tracking-wider">Nomor NIS Siswa</label>
                    <input type="text" id="nisn-input" placeholder="Contoh: 123" class="w-full px-3 py-2 border border-gray-300 bg-white rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 font-mono tracking-widest">
                </div>
                <div>
                    <label for="ibu-input" class="block text-[11px] font-bold text-gray-600 uppercase mb-1 tracking-wider">Nama Ibu Kandung</label>
                    <input type="text" id="ibu-input" placeholder="Masukkan nama lengkap ibu kandung" class="w-full px-3 py-2 border border-gray-300 bg-white rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 uppercase">
                </div>
                
                <button id="btn-cari" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-lg text-xs transition-colors shadow-sm tracking-wide uppercase">
                    Mulai Pencarian Data
                </button>
            </div>

            <!-- HASIL PENCARIAN -->
            <div id="hasil-tagihan" class="bg-white p-5 rounded-lg border border-gray-200 hidden shadow-md transition-all">
            </div>

            <div class="text-center pt-2 border-t border-gray-100">
                <a href="index.html" class="text-xs text-blue-900 hover:text-blue-700 font-bold inline-flex items-center gap-1 transition-colors">
                    ← Kembali ke Beranda Utama
                </a>
            </div>
        </div>
    </div>

</body>
</html>
