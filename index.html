<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD Plus Darussalam</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .reveal { opacity: 0; transform: translateY(20px); transition: all 0.6s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        /* Custom scrollbar untuk sidebar menu jika panjang */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- HEADER / NAVBAR -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-3">
                <div class="bg-amber-400 text-indigo-950 font-black p-2.5 rounded-xl text-xl leading-none">
                    SDP
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-wide leading-tight">SD PLUS DARUSSALAM</h1>
                    <p class="text-xs text-indigo-200">Sekolah Berkarakter, Sekolahnya Para Penghafal Al-Qur'an</p>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <div class="container mx-auto px-4 py-6 flex-grow">
        <!-- GRID UTAMA LAYOUT PC: 1 Kolom Sidebar Navigation (1/4), 1 Kolom Sidebar Media/Profil (1/4), 2 Kolom Berita Utama (2/4) -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

            <!-- ================= 1. SIDEBAR NAVIGASI MENU (KOLOM 1 DI PC) ================= -->
            <div class="lg:col-span-1">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 sticky top-24 max-h-[85vh] overflow-y-auto custom-scrollbar">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-2">Menu Utama</h2>
                    <nav id="sidebar-menu" class="space-y-1">
                        <!-- Menu Accordion di-render secara dinamis oleh JavaScript -->
                    </nav>
                </div>
            </div>

            <!-- ================= 2. SIDEBAR PROFIL & PENGUMUMAN (KOLOM 2 DI PC) ================= -->
            <aside class="lg:col-span-1 space-y-6">

                <!-- VIDEO PROFIL SEKOLAH (Posisinya di Atas) -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 reveal">
                    <h2 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
                        <span>📹</span> Profil Sekolah
                    </h2>
                    <div class="aspect-video rounded-xl overflow-hidden shadow-inner bg-slate-100">
                        <iframe 
                            class="w-full h-full" 
                            src="https://www.youtube.com/embed/Darussalamberkah" 
                            title="Profil SD Plus Darussalam"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>

                <!-- PENGUMUMAN (Tepat Berada di Bawah Video Profil Sekolah) -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 reveal">
                    <h2 class="text-sm font-bold text-slate-800 border-b-2 border-amber-400 pb-2 mb-3 flex items-center gap-2">
                        <span>🔔</span> PENGUMUMAN
                    </h2>
                    <div id="pengumuman-container" class="space-y-3">
                        <p class="text-xs text-slate-400 italic">Memuat pengumuman...</p>
                    </div>
                </div>

            </aside>

            <!-- ================= 3. BERITA UTAMA (KOLOM 3 & 4 DI PC) ================= -->
            <main class="lg:col-span-2 space-y-6">
                
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 reveal">
                    <h2 class="text-lg font-bold text-slate-800 mb-6 border-b pb-3 flex items-center gap-2">
                        <span>📰</span> Berita Terbaru
                    </h2>
                    <!-- Container Berita dari Google Sheets -->
                    <div id="berita-container" class="space-y-8">
                        <p class="text-sm text-slate-400 italic">Memuat berita terbaru...</p>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 SD Plus Darussalam. Semua Hak Cipta Dilindungi.</p>
    </footer>

    <!-- MODAL CEK TAGIHAN (Layanan Siswa) -->
    <div id="modal-tagihan" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeModalTagihan()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                💳 Cek Tagihan Siswa
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Masukkan NISN / NIS Siswa</label>
                    <input type="text" id="input-nisn" placeholder="Contoh: 12345678" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button onclick="prosesCekTagihan()" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-medium py-2 rounded-lg text-sm transition">
                    Cek Tagihan
                </button>
                <div id="hasil-tagihan" class="mt-4 hidden">
                    <!-- Hasil Tagihan akan muncul di sini -->
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC & DATA -->
    <script>
        const SPREADSHEET_ID = '1pR3W50Z24fD__v_Qds6MFsv5LR_BON0N6JceerOm86E';

        // 1. DATA MENU SIDEBAR LENGKAP
        const menuData = [
            {
                title: "PROFIL",
                items: [
                    { name: "Sejarah (Proses)", link: "#" },
                    { name: "Kurikulum", link: "#" }
                ]
            },
            {
                title: "LAYANAN SISWA",
                items: [
                    { name: "Cek Tagihan", action: "openModalTagihan" }
                ]
            },
            {
                title: "PROGRAM",
                items: [
                    { name: "Jadwal Pelajaran", link: "#" },
                    { name: "Ekstrakurikuler", link: "#" },
                    { name: "Kalender Kegiatan", link: "#" }
                ]
            },
            {
                title: "MEDIA",
                subCategories: [
                    {
                        title: "Ibadah Yaumiyah",
                        items: [
                            { name: "Wudhu", link: "#" },
                            { name: "Sholat", link: "#" },
                            { name: "Dzikir Ba'da Salam", link: "#" },
                            { name: "Dzikir Pagi", link: "#" },
                            { name: "Asmaul Husna", link: "#" }
                        ]
                    },
                    {
                        title: "Tahsin & Tahfidz",
                        items: [
                            { name: "An-Nur: Buku Jilid", link: "#" },
                            { name: "An-Nur: Video Jilid 1–3", link: "#" },
                            { name: "An-Nur: Tahfidz Juz 30", link: "#" },
                            { name: "An-Nur: Tahfidz Juz 29", link: "#" },
                            { name: "Jiharka: Tahsin Jiharka", link: "#" },
                            { name: "Jiharka: Tahfidz Jiharka", link: "#" }
                        ]
                    },
                    {
                        title: "Do'a & Hadits",
                        items: [
                            { name: "Do'a Yaumiyah", link: "#" },
                            { name: "Hadits Pilihan", link: "#" }
                        ]
                    }
                ]
            },
            {
                title: "PERPUSTAKAAN",
                items: [
                    { name: "Perpustakaan Darul Ilmi", link: "https://sites.google.com", external: true }
                ]
            },
            {
                title: "CAPAIAN",
                items: [
                    { name: "Tahfidz", link: "#" },
                    { name: "Prestasi", link: "#" },
                    { name: "Tinggi Badan", link: "#" },
                    { name: "Poin Kedisiplinan", link: "#" }
                ]
            },
            {
                title: "ARSIP",
                items: [
                    { name: "Worksheet (Proses)", link: "#" },
                    { name: "Ulhar (Proses)", link: "#" },
                    { name: "STS (Proses)", link: "#" },
                    { name: "SAS (Proses)", link: "#" }
                ]
            },
            {
                title: "ADMINISTRASI",
                items: [
                    { name: "WA Autorespon: 085210100175", link: "https://wa.me/6285210100175", external: true },
                    { name: "Transfer BRI: 6440 0103 6276 532", link: "#" },
                    { name: "Transfer Jatim: 180 2000 908", link: "#" }
                ]
            },
            {
                title: "MEDSOS",
                items: [
                    { name: "YouTube (Darussalamberkah)", link: "https://youtube.com", external: true },
                    { name: "Facebook", link: "https://facebook.com", external: true },
                    { name: "Instagram", link: "https://instagram.com", external: true }
                ]
            }
        ];

        // 2. RENDER MENU ACCORDION SIDEBAR
        function renderMenu() {
            const container = document.getElementById('sidebar-menu');
            container.innerHTML = '';

            menuData.forEach((section, idx) => {
                const sectionEl = document.createElement('div');
                sectionEl.className = "border-b border-slate-100 last:border-0 py-1";

                let subMenuHtml = '';
                
                if (section.items) {
                    subMenuHtml = section.items.map(item => {
                        if (item.action === "openModalTagihan") {
                            return `<button onclick="openModalTagihan()" class="w-full text-left block px-3 py-1.5 text-xs text-slate-600 hover:text-indigo-900 hover:bg-slate-50 rounded-lg transition">👉 ${item.name}</button>`;
                        }
                        return `<a href="${item.link}" ${item.external ? 'target="_blank"' : ''} class="block px-3 py-1.5 text-xs text-slate-600 hover:text-indigo-900 hover:bg-slate-50 rounded-lg transition">👉 ${item.name}</a>`;
                    }).join('');
                } else if (section.subCategories) {
                    subMenuHtml = section.subCategories.map(subCat => `
                        <div class="mt-1 mb-2 pl-2 border-l-2 border-indigo-100">
                            <span class="text-[11px] font-bold text-indigo-900 uppercase block mb-1 px-2">${subCat.title}</span>
                            ${subCat.items.map(item => `
                                <a href="${item.link}" class="block px-2 py-1 text-xs text-slate-600 hover:text-indigo-900 hover:bg-slate-50 rounded-lg transition">• ${item.name}</a>
                            `).join('')}
                        </div>
                    `).join('');
                }

                sectionEl.innerHTML = `
                    <button onclick="toggleAccordion('acc-${idx}')" class="w-full text-left font-semibold text-xs text-slate-700 hover:text-indigo-900 py-2 px-2 flex justify-between items-center transition">
                        <span>${section.title}</span>
                        <span id="icon-acc-${idx}" class="text-xs transition-transform duration-200">▾</span>
                    </button>
                    <div id="acc-${idx}" class="hidden space-y-0.5 pb-2">
                        ${subMenuHtml}
                    </div>
                `;
                container.appendChild(sectionEl);
            });
        }

        function toggleAccordion(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById(`icon-${id}`);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                if (icon) icon.style.transform = 'rotate(180deg)';
            } else {
                el.classList.add('hidden');
                if (icon) icon.style.transform = 'rotate(0deg)';
            }
        }

        // 3. HELPER TANGGAL
        function rapikanTanggal(dateStr) {
            if (!dateStr) return '';
            const match = dateStr.match(/Date\((\d+),(\d+),(\d+)\)/);
            if (match) {
                const year = match[1];
                const month = parseInt(match[2]) + 1;
                const day = match[3];
                const bulanIndo = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                return `${day} ${bulanIndo[month - 1]} ${year}`;
            }
            return dateStr;
        }

        // 4. FETCH DATA PENGUMUMAN DARI GOOGLE SHEETS
        async function fetchPengumuman() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Pengumuman`;
            try {
                const res = await fetch(url);
                const text = await res.text();
                const json = JSON.parse(text.substring(47, text.length - 2));
                const rows = json.table.rows;
                const container = document.getElementById('pengumuman-container');
                container.innerHTML = '';

                if (!rows || rows.length === 0) {
                    container.innerHTML = '<p class="text-xs text-slate-400">Tidak ada pengumuman saat ini.</p>';
                    return;
                }

                rows.forEach(row => {
                    const judul = row.c && row.c[0] ? row.c[0].v : 'Pengumuman';
                    const tanggalRaw = row.c && row.c[1] ? row.c[1].v : '';
                    const tanggal = rapikanTanggal(tanggalRaw);

                    const card = document.createElement('div');
                    card.className = "p-3 rounded-xl bg-slate-50 hover:bg-amber-50/60 border border-slate-100 transition duration-200";
                    card.innerHTML = `
                        <h3 class="font-semibold text-xs text-slate-800 leading-snug">${judul}</h3>
                        ${tanggal ? `<p class="text-[11px] text-slate-400 mt-1 flex items-center gap-1">📅 ${tanggal}</p>` : ''}
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Gagal memuat pengumuman:", err);
                document.getElementById('pengumuman-container').innerHTML = '<p class="text-xs text-red-400">Gagal memuat data pengumuman.</p>';
            }
        }

        // 5. FETCH DATA BERITA DARI GOOGLE SHEETS
        async function fetchBerita() {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Berita`;
            try {
                const res = await fetch(url);
                const text = await res.text();
                const json = JSON.parse(text.substring(47, text.length - 2));
                const rows = json.table.rows;
                const container = document.getElementById('berita-container');
                container.innerHTML = '';

                if (!rows || rows.length === 0) {
                    container.innerHTML = '<p class="text-xs text-slate-400">Belum ada berita dipublikasikan.</p>';
                    return;
                }

                rows.forEach((row, idx) => {
                    const judul = row.c && row.c[0] ? row.c[0].v : '';
                    const isi = row.c && row.c[1] ? row.c[1].v : '';
                    const gambar = row.c && row.c[2] ? row.c[2].v : '';

                    const article = document.createElement('article');
                    article.className = "border-b border-slate-100 pb-6 last:border-0 last:pb-0";
                    
                    const isLongText = isi.length > 200;
                    const ringkasanText = isLongText ? isi.substring(0, 200) + '...' : isi;

                    article.innerHTML = `
                        ${gambar ? `<img src="${gambar}" alt="${judul}" class="w-full h-56 sm:h-72 object-cover rounded-xl mb-4 shadow-sm">` : ''}
                        <h3 class="text-lg font-bold text-slate-800 mb-2 leading-snug">${judul}</h3>
                        <div class="text-slate-600 text-xs sm:text-sm leading-relaxed mb-3">
                            <span id="berita-text-${idx}">${ringkasanText}</span>
                            ${isLongText ? `<span id="berita-full-${idx}" class="hidden">${isi}</span>` : ''}
                        </div>
                        ${isLongText ? `
                            <button onclick="toggleBerita(${idx})" id="btn-berita-${idx}" class="inline-flex items-center gap-1 bg-indigo-900 hover:bg-indigo-800 text-white text-xs px-3.5 py-1.5 rounded-lg font-medium transition duration-200">
                                Baca Selengkapnya &rarr;
                            </button>
                        ` : ''}
                    `;
                    container.appendChild(article);
                });
            } catch (err) {
                console.error("Gagal memuat berita:", err);
                document.getElementById('berita-container').innerHTML = '<p class="text-xs text-red-400">Gagal memuat berita.</p>';
            }
        }

        // Toggle Baca Selengkapnya Berita
        function toggleBerita(idx) {
            const ringkasan = document.getElementById(`berita-text-${idx}`);
            const full = document.getElementById(`berita-full-${idx}`);
            const btn = document.getElementById(`btn-berita-${idx}`);

            if (full.classList.contains('hidden')) {
                full.classList.remove('hidden');
                ringkasan.classList.add('hidden');
                btn.innerHTML = 'Sembunyikan &larr;';
            } else {
                full.classList.add('hidden');
                ringkasan.classList.remove('hidden');
                btn.innerHTML = 'Baca Selengkapnya &rarr;';
            }
        }

        // 6. MODAL TAGIHAN HANDLER
        function openModalTagihan() {
            document.getElementById('modal-tagihan').classList.remove('hidden');
        }
        function closeModalTagihan() {
            document.getElementById('modal-tagihan').classList.add('hidden');
            document.getElementById('hasil-tagihan').classList.add('hidden');
            document.getElementById('input-nisn').value = '';
        }
        function prosesCekTagihan() {
            const nisn = document.getElementById('input-nisn').value.trim();
            const hasilContainer = document.getElementById('hasil-tagihan');
            if(!nisn) {
                alert('Silakan masukkan NISN / NIS terlebih dahulu!');
                return;
            }
            hasilContainer.classList.remove('hidden');
            hasilContainer.innerHTML = `
                <div class="p-3 bg-indigo-50 border border-indigo-100 rounded-lg text-xs text-indigo-900">
                    <p class="font-bold mb-1">Status Tagihan (NISN: ${nisn}):</p>
                    <p>Semua tagihan administrasi bulanan telah LUNAS.</p>
                </div>
            `;
        }

        // 7. ANIMASI SCROLL REVEAL
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, { threshold: 0.1 });

        // INITIALIZATION
        document.addEventListener("DOMContentLoaded", () => {
            renderMenu();
            fetchPengumuman();
            fetchBerita();
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
