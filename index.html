        .reveal {

            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);

        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        * {
            transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.25s ease, transform 0.25s ease;

        /* Accordion Menu */
        .accordion-content {

            transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .accordion-content.open {
            grid-template-rows: 1fr;
        }

        .accordion-inner {
            overflow: hidden;
        }

        .card-hover {
            will-change: transform;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.12);
        }

        ::-webkit-scrollbar {
            width: 6px;

            background: #cbd5e1;

// 2. KONFIGURASI GOOGLE SHEETS
const SPREADSHEET_ID = '1pR3W50Z24fD__v_Qds6MFsv5LR_BON0N6JceerOm86E';

async function fetchSheetData(sheetName) {
    const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(sheetName)}`;
    const response = await fetch(url);
    const text = await response.text();
    
    const jsonLeft = text.indexOf('{');
    const jsonRight = text.lastIndexOf('}') + 1;
    const cleanJson = JSON.parse(text.substring(jsonLeft, jsonRight));
    
    const rows = cleanJson.table.rows;
    const cols = cleanJson.table.cols.map(col => col && col.label ? col.label.trim() : '');
    
    return rows.map(row => {
        const obj = {};
        cols.forEach((colName, index) => {
            if (colName) {
                const cell = row.c[index];
                let cellValue = '';
                if (cell) {
                    if (cell.f !== null && cell.f !== undefined) {
                        cellValue = cell.f;
                    } else if (cell.v !== null && cell.v !== undefined) {
                        cellValue = cell.v;
                    }
                }
                obj[colName] = String(cellValue).replaceAll('\n', '<br>');
            }
        });
        return obj;
    }).filter(item => item.judul && item.judul.trim() !== "");
}

// 3. FUNGSI SCROLL REVEAL OBSERVER
function initScrollObserver() {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('active');
            }
        });
    }, {
        threshold: 0.1,
        rootMargin: "0px 0px -40px 0px"
    });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
}

// 4. PENANGAN PENAMPIL SHEET / EMBED INTERIOR WEB
function handleLinkClick(url, title, eksternal) {
    if (!url || url === '#') return;

    if (eksternal) {
        window.open(url, '_blank');
        return;
    }

    if (url.includes('docs.google.com/spreadsheets')) {
        let embedUrl = url;
        
        if (url.includes('/edit')) {
            embedUrl = url.replace('/edit', '/htmlembed') + '&widget=false&chrome=false';
        }

        document.getElementById('embed-title').textContent = title;
        document.getElementById('embed-iframe').src = embedUrl;
        document.getElementById('embed-external-link').href = url;

        document.getElementById('berita-view').classList.add('hidden');
        document.getElementById('embed-view').classList.remove('hidden');
    } else {
        window.location.href = url;
    }
}

function showHomeView() {

// 5. RENDERING BERITA
function renderBerita(data) {
    const container = document.getElementById('berita-list-container');
    const loadingElem = document.getElementById('loading-berita');
    if (loadingElem) loadingElem.classList.add('hidden');
    container.innerHTML = '';
    
    if (data.length === 0 || !data[0].judul) {
        container.innerHTML = `<p class="text-slate-400 py-6 text-center text-sm">Belum ada berita terbaru saat ini.</p>`;
        return;
    }

    [...data].reverse().forEach((berita, index) => {
        const idBerita = berita.id ? berita.id : `berita-${index}`;
        
        let daftarGambar = [];
        if (Array.isArray(berita.gambar)) {
            daftarGambar = berita.gambar;
        } else if (typeof berita.gambar === 'string' && berita.gambar.trim() !== '') {
            daftarGambar = berita.gambar.split(',').map(img => img.trim());
        } else {
            daftarGambar = ['Berita-1.jpg'];
        }

        const htmlGaleri = `
            <div class="grid grid-cols-1 ${daftarGambar.length > 1 ? 'sm:grid-cols-2' : ''} gap-2 rounded-lg overflow-hidden bg-slate-100 p-1 border border-slate-200/60">
                ${daftarGambar.map(imgUrl => `
                    <div class="w-full flex justify-center items-center overflow-hidden rounded-md">
                        <img src="${imgUrl}" alt="${berita.judul}" class="w-full max-h-80 object-contain hover:scale-105 transition-transform duration-300">
                    </div>
                `).join('')}
            </div>
        `;

        const itemHtml = `
            <div class="card-hover bg-white p-4 rounded-xl border border-slate-100 space-y-4 border-b border-slate-200/80 pb-6 mt-4 reveal">
                ${htmlGaleri}

                <h3 onclick="toggleBerita('${idBerita}')" class="text-xl font-bold text-slate-800 hover:text-blue-900 cursor-pointer transition-colors leading-snug">${berita.judul}</h3>
                <p id="konten-pendek-${idBerita}" class="text-slate-600 leading-relaxed text-sm text-justify">${berita.kontenPendek || ''}</p>
                
                <div id="konten-lengkap-${idBerita}" class="hidden text-slate-600 leading-relaxed text-sm text-justify space-y-2">
                    <p>${berita.kontenLengkap || ''}</p>
                </div>
                
                <button onclick="toggleBerita('${idBerita}')" id="btn-baca-${idBerita}" class="inline-flex items-center gap-1.5 bg-blue-900 hover:bg-blue-800 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm hover:shadow transition-all duration-200">
                    <span>Baca Selengkapnya</span>
                    <span id="btn-arrow-${idBerita}">→</span>
                </button>
            </div>
        `;
        container.innerHTML += itemHtml;
    });
}

function toggleBerita(id) {
    const lengkap = document.getElementById(`konten-lengkap-${id}`);
    const pendek = document.getElementById(`konten-pendek-${id}`);
    const btnText = document.querySelector(`#btn-baca-${id} span:first-child`);
    const btnArrow = document.getElementById(`btn-arrow-${id}`);

    if (lengkap.classList.contains('hidden')) {
        lengkap.classList.remove('hidden');
        pendek.classList.add('hidden');
        if (btnText) btnText.textContent = 'Sembunyikan';
        if (btnArrow) btnArrow.textContent = '↑';
    } else {
        lengkap.classList.add('hidden');
        pendek.classList.remove('hidden');
        if (btnText) btnText.textContent = 'Baca Selengkapnya';
        if (btnArrow) btnArrow.textContent = '→';
    }
}

function renderPengumuman(data) {

    const dataValid = data.filter(p => p.judul && p.judul.toString().trim() !== "");

    if (dataValid.length === 0) {

    function rapikanTanggal(tgl) {
        if (!tgl) return '';
        const stringTgl = String(tgl).trim();
        if (stringTgl.startsWith('Date(')) {
            try {
                const bagian = stringTgl.match(/\(([^)]+)\)[^,]*?/)[1].split(',');
                const tahun = parseInt(bagian[0]);
                const bulan = parseInt(bagian[1]); 
                const hari = parseInt(bagian[2]);
                const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                return `${hari} ${namaBulan[bulan]} ${tahun}`;
            } catch (e) { return stringTgl; }
        }
        return stringTgl;
    }

    let listHtml = '<div class="space-y-2.5 max-h-[420px] overflow-y-auto pr-1">';
    [...dataValid].reverse().forEach(p => {
        const tanggalRapi = rapikanTanggal(p.tanggal);
        listHtml += `
            <div class="card-hover bg-white hover:bg-amber-50/30 border border-slate-200/60 hover:border-amber-300 p-3.5 rounded-lg shadow-2xs transition-all duration-300 cursor-pointer reveal">
                <div class="border-l-3 border-amber-400 pl-3">
                    <p class="font-semibold text-slate-800 text-xs leading-relaxed mb-1 hover:text-amber-700 transition-colors">${p.judul}</p>
                    ${tanggalRapi ? `<div class="flex items-center text-[10px] text-slate-400 gap-1 font-medium"><span>${tanggalRapi}</span></div>` : ''}
                </div>
            </div>
        `;
    });
    listHtml += '</div>';
    containerList.innerHTML = listHtml;
}

function renderMenu() {
    const container = document.getElementById('menu-container');
    if (!container) return;
    container.innerHTML = '';

    menuData.forEach((item, index) => {
        const menuDiv = document.createElement('div');
        menuDiv.className = "border-b border-slate-200/60 last:border-none pb-1.5 last:pb-0";

        if (item.isNested) {
            menuDiv.innerHTML = `
                <button onclick="toggleMenu(${index})" class="w-full text-left font-bold text-slate-700 hover:text-blue-900 flex justify-between items-center py-1.5 text-xs tracking-wider uppercase transition-colors group">
                    <span>${item.nama}</span> 
                    <span id="arrow-${index}" class="text-[9px] text-slate-400 group-hover:text-blue-900 transition-transform duration-300">▼</span>
                </button>
                <div id="sub-${index}" class="accordion-content">
                    <div class="accordion-inner pl-2.5 mt-1 space-y-1 border-l-2 border-slate-200">
                        ${item.sub.map((nestedItem, nestedIndex) => {
                            if (nestedItem.hasDeepNested) {
                                return `
                                    <div class="space-y-1">
                                        <button onclick="toggleNestedMenu(${index}, ${nestedIndex})" class="w-full text-left font-semibold text-slate-600 hover:text-blue-800 flex justify-between items-center py-1 text-xs transition-colors group">
                                            <span>• ${nestedItem.nama}</span> 
                                            <span id="nested-arrow-${index}-${nestedIndex}" class="text-[8px] text-slate-400 group-hover:text-blue-800 transition-transform duration-300">▼</span>
                                        </button>
                                        <div id="nested-sub-${index}-${nestedIndex}" class="accordion-content">
                                            <div class="accordion-inner pl-2.5 space-y-1 border-l border-dashed border-slate-200">
                                                ${nestedItem.categories.map((cat, catIndex) => `
                                                    <div class="space-y-1">
                                                        <button onclick="toggleDeepNestedMenu(${index}, ${nestedIndex}, ${catIndex})" class="w-full text-left font-medium text-slate-500 hover:text-blue-700 flex justify-between items-center py-0.5 text-[11px] transition-colors group">
                                                            <span>› ${cat.nama}</span>
                                                            <span id="deep-arrow-${index}-${nestedIndex}-${catIndex}" class="text-[8px] text-slate-400 group-hover:text-blue-700 transition-transform duration-300">▼</span>
                                                        </button>
                                                        <div id="deep-sub-${index}-${nestedIndex}-${catIndex}" class="accordion-content">
                                                            <div class="accordion-inner pl-2 space-y-0.5 border-l border-dotted border-slate-200">
                                                                ${cat.items.map(subItem => `
                                                                    <a href="javascript:void(0)" 
                                                                       onclick="handleLinkClick('${subItem.link}', '${subItem.nama}', ${subItem.eksternal})" 
                                                                       class="text-slate-500 hover:text-blue-800 hover:translate-x-1 text-[10.5px] block py-0.5 transition-all">
                                                                        - ${subItem.nama} ${subItem.eksternal ? '↗' : ''}
                                                                    </a>
                                                                `).join('')}
                                                            </div>
                                                        </div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            } else {
                                return `
                                    <div class="space-y-1">
                                        <button onclick="toggleNestedMenu(${index}, ${nestedIndex})" class="w-full text-left font-semibold text-slate-600 hover:text-blue-800 flex justify-between items-center py-1 text-xs transition-colors group">
                                            <span>• ${nestedItem.nama}</span> 
                                            <span id="nested-arrow-${index}-${nestedIndex}" class="text-[8px] text-slate-400 group-hover:text-blue-800 transition-transform duration-300">▼</span>
                                        </button>
                                        <div id="nested-sub-${index}-${nestedIndex}" class="accordion-content">
                                            <div class="accordion-inner pl-2.5 space-y-0.5 border-l border-dashed border-slate-200">
                                                ${nestedItem.items.map(subItem => `
                                                    <a href="javascript:void(0)" 
                                                       onclick="handleLinkClick('${subItem.link}', '${subItem.nama}', ${subItem.eksternal})" 
                                                       class="text-slate-500 hover:text-blue-800 hover:translate-x-1 text-[11px] block py-0.5 transition-all">
                                                        - ${subItem.nama} ${subItem.eksternal ? '↗' : ''}
                                                    </a>
                                                `).join('')}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }
                        }).join('')}
                    </div>
                </div>
            `;
        } else {
            menuDiv.innerHTML = `
                <button onclick="toggleMenu(${index})" class="w-full text-left font-bold text-slate-700 hover:text-blue-900 flex justify-between items-center py-1.5 text-xs tracking-wider uppercase transition-colors group">
                    <span>${item.nama}</span> 
                    <span id="arrow-${index}" class="text-[9px] text-slate-400 group-hover:text-blue-900 transition-transform duration-300">▼</span>
                </button>
                <div id="sub-${index}" class="accordion-content">
                    <div class="accordion-inner pl-2.5 mt-1 space-y-0.5 border-l-2 border-slate-200">
                        ${item.sub.map(sub => `
                            <a href="javascript:void(0)" 
                               onclick="handleLinkClick('${sub.link}', '${sub.nama}', ${sub.eksternal})" 
                               class="text-slate-600 hover:text-blue-800 hover:translate-x-1 text-xs block py-1 transition-all">
                                • ${sub.nama} ${sub.eksternal ? '↗' : ''}
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        container.appendChild(menuDiv);
    });
}

// TOGGLE INTERAKSI ACCORDION
function toggleMenu(index) {
    const subMenu = document.getElementById(`sub-${index}`);
    const arrow = document.getElementById(`arrow-${index}`);
    if (subMenu) {
        subMenu.classList.toggle('open');
        if (arrow) arrow.style.transform = subMenu.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
    }
}

function toggleNestedMenu(parentIndex, nestedIndex) {
    const nestedSub = document.getElementById(`nested-sub-${parentIndex}-${nestedIndex}`);
    const arrow = document.getElementById(`nested-arrow-${parentIndex}-${nestedIndex}`);
    if (nestedSub) {
        nestedSub.classList.toggle('open');
        if (arrow) arrow.style.transform = nestedSub.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
    }
}

function toggleDeepNestedMenu(parentIndex, nestedIndex, catIndex) {
    const deepSub = document.getElementById(`deep-sub-${parentIndex}-${nestedIndex}-${catIndex}`);
    const arrow = document.getElementById(`deep-arrow-${parentIndex}-${nestedIndex}-${catIndex}`);
    if (deepSub) {
        deepSub.classList.toggle('open');
        if (arrow) arrow.style.transform = deepSub.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
    }
}
</script>
