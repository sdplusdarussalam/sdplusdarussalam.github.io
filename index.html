        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), url('bangunan-sekolah.jpg');

            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* --- ANIMASI SCROLL REVEAL & TRANSISI --- */
        
        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        * {
            transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.25s ease, transform 0.25s ease;
        }

        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .accordion-content.open {
            grid-template-rows: 1fr;
        }

        .accordion-inner {
            overflow: hidden;
        }

        .card-hover {
            will-change: transform;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.12);
        }

        /* Custom Scrollbar Elegan */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>

// 2. KONFIGURASI GOOGLE SHEETS
const SPREADSHEET_ID = '1pR3W50Z24fD__v_Qds6MFsv5LR_BON0N6JceerOm86E';

async function fetchSheetData(sheetName) {
    const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(sheetName)}`;
    const response = await fetch(url);
    const text = await response.text();
    
    const jsonLeft = text.indexOf('{');
    const jsonRight = text.lastIndexOf('}') + 1;
    const cleanJson = JSON.parse(text.substring(jsonLeft, jsonRight));
    
    const rows = cleanJson.table.rows;
    const cols = cleanJson.table.cols.map(col => col && col.label ? col.label.trim() : '');
    
    return rows.map(row => {
        const obj = {};
        cols.forEach((colName, index) => {
            if (colName) {
                const cell = row.c[index];
                let cellValue = '';
                
                if (cell) {
                    if (cell.f !== null && cell.f !== undefined) {
                        cellValue = cell.f;
                    } else if (cell.v !== null && cell.v !== undefined) {
                        cellValue = cell.v;
                    }
                }
                
                obj[colName] = String(cellValue).replaceAll('\n', '<br>');
            }
        });
        return obj;
    }).filter(item => item.judul && item.judul.trim() !== "");
}

// 3. FUNGSI OBSERVER UNTUK ANIMASI SCROLL REVEAL
function initScrollObserver() {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('active');
            }
        });
    }, {
        threshold: 0.1,
        rootMargin: "0px 0px -40px 0px"
    });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
}

function renderPengumuman(data) {
    const containerPengumuman = document.getElementById('pengumuman-container');
    
    containerPengumuman.innerHTML = `
        <h2 class="text-sm font-bold mb-3 text-gray-700 border-b-2 border-amber-400 pb-2 uppercase tracking-wider flex items-center gap-2">
            <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            Pengumuman
        </h2>
        <div class="space-y-2.5 max-h-[320px] overflow-y-auto pr-1">
    `;

    const dataValid = data.filter(p => p.judul && p.judul.toString().trim() !== "");

    if (dataValid.length === 0) {
        containerPengumuman.innerHTML += `
            <p class="text-slate-400 text-xs py-4 text-center italic bg-slate-50/50 rounded-lg border border-dashed border-slate-200">Tidak ada pengumuman baru.</p>
            </div>
        `;
        return;
    }

    function rapikanTanggal(tgl) {
        if (!tgl) return '';
        const stringTgl = String(tgl).trim();
        if (stringTgl.startsWith('Date(')) {
            try {
                const bagian = stringTgl.match(/\(([^)]+)\)/)[1].split(',');
                const tahun = parseInt(bagian[0]);
                const bulan = parseInt(bagian[1]); 
                const hari = parseInt(bagian[2]);
                const namaBulan = [
                    "Januari", "Februari", "Maret", "April", "Mei", "Juni", 
                    "Juli", "Agustus", "September", "Oktober", "November", "Desember"
                ];
                return `${hari} ${namaBulan[bulan]} ${tahun}`;
            } catch (e) {
                return stringTgl;
            }
        }
        return stringTgl;
    }

    let listHtml = '';
    [...dataValid].reverse().forEach(p => {
        const tanggalRapi = rapikanTanggal(p.tanggal);
        listHtml += `
            <div class="card-hover bg-white hover:bg-amber-50/30 border border-slate-200/60 hover:border-amber-300 p-3.5 rounded-lg shadow-2xs transition-all duration-300 cursor-pointer reveal">
                <div class="border-l-3 border-amber-400 pl-3">
                    <p class="font-semibold text-slate-800 text-xs leading-relaxed mb-1 hover:text-amber-700 transition-colors">${p.judul}</p>
                    ${tanggalRapi ? `
                        <div class="flex items-center text-[10px] text-slate-400 gap-1 font-medium">
                            <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <span>${tanggalRapi}</span>
                        </div>
                    ` : ''}
                </div>
            </div>
        `;
    });

    containerPengumuman.innerHTML += listHtml + '</div>';
}

                </button>
                <div id="sub-${index}" class="accordion-content">
                    <div class="accordion-inner pl-2.5 mt-1 space-y-1 border-l-2 border-slate-200">
                        ${item.sub.map((nestedItem, nestedIndex) => {
                            if (nestedItem.hasDeepNested) {
                                return `
                                    <div class="space-y-1">
                                        <button onclick="toggleNestedMenu(${index}, ${nestedIndex})" class="w-full text-left font-semibold text-slate-600 hover:text-blue-800 flex justify-between items-center py-1 text-xs transition-colors group">
                                            <span>• ${nestedItem.nama}</span> 
                                            <span id="nested-arrow-${index}-${nestedIndex}" class="text-[8px] text-slate-400 group-hover:text-blue-800 transition-transform duration-300">▼</span>
                                        </button>
                                        <div id="nested-sub-${index}-${nestedIndex}" class="accordion-content">
                                            <div class="accordion-inner pl-2.5 space-y-1 border-l border-dashed border-slate-200">
                                                ${nestedItem.categories.map((cat, catIndex) => `
                                                    <div class="space-y-1">
                                                        <button onclick="toggleDeepNestedMenu(${index}, ${nestedIndex}, ${catIndex})" class="w-full text-left font-medium text-slate-500 hover:text-blue-700 flex justify-between items-center py-0.5 text-[11px] transition-colors group">
                                                            <span>› ${cat.nama}</span>
                                                            <span id="deep-arrow-${index}-${nestedIndex}-${catIndex}" class="text-[8px] text-slate-400 group-hover:text-blue-700 transition-transform duration-300">▼</span>
                                                        </button>
                                                        <div id="deep-sub-${index}-${nestedIndex}-${catIndex}" class="accordion-content">
                                                            <div class="accordion-inner pl-2 space-y-0.5 border-l border-dotted border-slate-200">
                                                                ${cat.items.map(subItem => `
                                                                    <a href="${subItem.link}" 
                                                                       ${subItem.eksternal ? 'target="_blank" rel="noopener noreferrer"' : ''} 
                                                                       class="text-slate-500 hover:text-blue-800 hover:translate-x-1 text-[10.5px] block py-0.5 transition-all">
                                                                        - ${subItem.nama} ${subItem.eksternal && subItem.link !== '#' ? '↗' : ''}
                                                                    </a>
                                                                `).join('')}
                                                            </div>
                                                        </div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            } else {
                                return `
                                    <div class="space-y-1">
                                        <button onclick="toggleNestedMenu(${index}, ${nestedIndex})" class="w-full text-left font-semibold text-slate-600 hover:text-blue-800 flex justify-between items-center py-1 text-xs transition-colors group">
                                            <span>• ${nestedItem.nama}</span> 
                                            <span id="nested-arrow-${index}-${nestedIndex}" class="text-[8px] text-slate-400 group-hover:text-blue-800 transition-transform duration-300">▼</span>
                                        </button>
                                        <div id="nested-sub-${index}-${nestedIndex}" class="accordion-content">
                                            <div class="accordion-inner pl-2.5 space-y-0.5 border-l border-dashed border-slate-200">
                                                ${nestedItem.items.map(subItem => `
                                                    <a href="${subItem.link}" 
                                                       ${subItem.eksternal ? 'target="_blank" rel="noopener noreferrer"' : ''} 
                                                       class="text-slate-500 hover:text-blue-800 hover:translate-x-1 text-[11px] block py-0.5 transition-all">
                                                        - ${subItem.nama} ${subItem.eksternal && subItem.link !== '#' ? '↗' : ''}
                                                    </a>
                                                `).join('')}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }
                        }).join('')}
                    </div>
                </div>
            `;
        } else {
            menuDiv.innerHTML = `
                <button onclick="toggleMenu(${index})" class="w-full text-left font-bold text-slate-700 hover:text-blue-900 flex justify-between items-center py-1.5 text-xs tracking-wider uppercase transition-colors group">
                    <span>${item.nama}</span> 
                    <span id="arrow-${index}" class="text-[9px] text-slate-400 group-hover:text-blue-900 transition-transform duration-300">▼</span>
                </button>
                <div id="sub-${index}" class="accordion-content">
                    <div class="accordion-inner pl-2.5 mt-1 space-y-0.5 border-l-2 border-slate-200">
                        ${item.sub.map(sub => `
                            <a href="${sub.link}" 
                               ${sub.eksternal ? 'target="_blank" rel="noopener noreferrer"' : ''} 
                               class="text-slate-600 hover:text-blue-800 hover:translate-x-1 text-xs block py-1 transition-all">
                                 • ${sub.nama} ${sub.eksternal && sub.link !== '#' ? '↗' : ''}
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        container.appendChild(menuDiv);
    });
}

// 5. INTERAKSI TOGGLE
function toggleMenu(index) {
    const subMenu = document.getElementById(`sub-${index}`);
    const arrow = document.getElementById(`arrow-${index}`);
    if (subMenu && arrow) {
        const isOpen = subMenu.classList.toggle('open');
        arrow.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
    }
}

function toggleNestedMenu(parentIndex, nestedIndex) {
    const nestedSubMenu = document.getElementById(`nested-sub-${parentIndex}-${nestedIndex}`);
    const nestedArrow = document.getElementById(`nested-arrow-${parentIndex}-${nestedIndex}`);
    if (nestedSubMenu && nestedArrow) {
        const isOpen = nestedSubMenu.classList.toggle('open');
        nestedArrow.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
    }
}

function toggleDeepNestedMenu(parentIndex, nestedIndex, catIndex) {
    const deepSubMenu = document.getElementById(`deep-sub-${parentIndex}-${nestedIndex}-${catIndex}`);
    const deepArrow = document.getElementById(`deep-arrow-${parentIndex}-${nestedIndex}-${catIndex}`);
    if (deepSubMenu && deepArrow) {
        const isOpen = deepSubMenu.classList.toggle('open');
        deepArrow.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
    }
}

function toggleBerita(id) {
    const lengkap = document.getElementById(`konten-lengkap-${id}`);
    const pendek = document.getElementById(`konten-pendek-${id}`);
    const btn = document.getElementById(`btn-baca-${id}`);
    const arrow = document.getElementById(`btn-arrow-${id}`);
    
    if (lengkap && pendek && btn) {
        const isHidden = lengkap.classList.contains('hidden');
        lengkap.classList.toggle('hidden');
        pendek.classList.toggle('hidden');
        
        btn.querySelector('span').textContent = isHidden ? "Sembunyikan" : "Baca Selengkapnya";
        if (arrow) arrow.textContent = isHidden ? "←" : "→";
    }
}
</script>
